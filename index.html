<style>
  :root{ --hue: 260; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  #stage{ position:relative; z-index:1; height:100vh; height:100dvh; max-width:560px; margin:0 auto;
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px); }
  #stage.shake{ animation:shake .35s; }
  @keyframes shake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-9px,5px)} 40%{transform:translate(8px,-4px)}
    60%{transform:translate(-6px,3px)} 80%{transform:translate(4px,-2px)} }

  header{ display:flex; align-items:flex-start; gap:8px; }
  .hcol{ flex:1 } .hcol.right{ text-align:right }
  #lives{ font-size:20px; letter-spacing:2px; padding-top:8px }

  #hud-ring{ font-size:12px; font-weight:800; min-height:16px }
  #btn-mute{ background:none; border:none; font-size:20px; padding:6px; cursor:pointer; opacity:.85 }

  #cv{ flex:1; width:100%; min-height:0; touch-action:none; margin-top:6px }

  #toast{ position:absolute; left:0; right:0; top:33%; z-index:9; text-align:center; pointer-events:none;

    text-shadow:0 4px 18px rgba(0,0,0,.65); }
  #toast.show{ animation:pop .85s ease forwards; }
  @keyframes pop{
    0%{opacity:0; transform:scale(.4) rotate(-4deg)}
    18%{opacity:1; transform:scale(1.15) rotate(2deg)}
    32%{transform:scale(1)}
    72%{opacity:1}
    100%{opacity:0; transform:scale(1) translateY(-16px)} }
  .t-perfect{ color:#7cffb2 } .t-good{ color:#ffd666 } .t-miss{ color:#ff6b81 } .t-ach{ color:#ffe08a }

  .overlay{ position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;

  .overlay.hidden{ display:none }

  .title span{ display:inline-block; font-size:clamp(52px,17vw,88px); font-weight:900; letter-spacing:6px;
    background:linear-gradient(135deg,#ff5f9e,#ffb86b,#7c5cff);
    -webkit-background-clip:text; background-clip:text; color:transparent;

  .title.small span{ font-size:clamp(38px,12vw,60px) }
  .title span:nth-child(2){ animation-delay:.15s }
  .title span:nth-child(3){ animation-delay:.3s }
  .title span:nth-child(4){ animation-delay:.45s }
  @keyframes wob{ 0%,100%{transform:translateY(0) rotate(0)}
    30%{transform:translateY(-10px) rotate(-3deg)} 60%{transform:translateY(4px) rotate(2deg)} }

  .subtitle{ margin:0; font-size:15px; opacity:.85 }
  .howto p{ margin:6px 0; opacity:.85; font-size:13.5px }
  .tiny{ font-size:12px; opacity:.45; margin:3px 0 0 }

  .big-btn{ font-size:22px; padding:15px 46px; border-radius:999px; border:none; color:#fff;
    font-weight:800; letter-spacing:4px; cursor:pointer; margin-top:4px;

    box-shadow:0 8px 24px rgba(124,92,255,.45); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .ghost-btn{ background:transparent; border:1px solid rgba(255,255,255,.35); color:rgba(255,255,255,.85);

    text-decoration:underline; cursor:pointer; }

  .score-box{ display:flex; flex-direction:column; align-items:center; gap:5px;
    background:rgba(255,255,255,.06); border-radius:20px; padding:16px 38px; margin:6px 0; }
  .fs{ font-size:clamp(56px,18vw,84px); font-weight:900; line-height:1;
    background:linear-gradient(135deg,#ffd666,#ff5f9e); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .frow{ font-size:13px; opacity:.8 } .frow b{ color:#ffd666 }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; width:100%; max-width:400px; margin:4px 0 }
  .stat-cell{ background:rgba(255,255,255,.06); border-radius:12px; padding:8px 10px; text-align:left }
  .stat-cell .k{ font-size:11px; opacity:.6 } .stat-cell .v{ font-size:16px; font-weight:800 }

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const stage=$("stage"), cv=$("cv"), ctx=cv.getContext("2d");
const hudScore=$("hud-score"), hudCombo=$("hud-combo"), hudLevel=$("hud-level"),
      hudRing=$("hud-ring"), livesEl=$("lives"), toastEl=$("toast"),
      menuEl=$("menu"), overEl=$("over"), statsEl=$("stats"),
      finalScore=$("final-score"), finalCombo=$("final-combo"), finalBest=$("final-best"),
      finalDaily=$("final-daily"), dailyRow=$("daily-row"),
      finalCareer=$("final-career"), careerRow=$("career-row"),
      roastEl=$("roast"), muteBtn=$("btn-mute"),
      achCount=$("ach-count"), careerLine=$("career-line"),
      statGrid=$("stat-grid"), achGrid=$("ach-grid");

const VERSION="3.0";
const MUSIC_ON=true;

let W=0,H=0,minD=0,cx=0,cy=0;
let mode="menu";                       // menu | play | over
let score=0,combo=0,bestCombo=0,lives=3,hits=0,perfectCount=0;
let speed=0, ring=null, spawnTimer=null, last=performance.now();
let flash=0, skullT=0, particles=[], ghosts=[], hue=260;
let daily=false, dailyKey="", rng=Math.random;
let emptyStreak=0, lastResolve=0;
let bossQueue=0, bossHits=0;
let purePerfectStreak=0, goldenPerfRun=0;
let stars=[], vig=null;

let best=0; try{ best=+(localStorage.getItem("biebengle_best")||0); }catch(e){}
let unlocked=new Set(); try{ unlocked=new Set(JSON.parse(localStorage.getItem("biebengle_achv")||"[]")); }catch(e){}
let seenTypes={}; try{ seenTypes=JSON.parse(localStorage.getItem("biebengle_seen")||"{}"); }catch(e){}
let career={ points:0, games:0, perfects:0, bestScore:0, bestCombo:0, days:{} };
try{
  const raw=JSON.parse(localStorage.getItem("biebengle_stats")||"null");
  if(raw&&typeof raw==="object"&&raw.days){ career=raw; }
  else throw 0;
}catch(e){
  career.bestScore=best;               // 老玩家迁移：把历史最高分带进生涯
}
let muted=false, AC=null;

const F_START=0.42, T_FRAC=0.125, BASE=(F_START-T_FRAC)/1.5;   // 都按短边比例算

const PERFECT=["泰裤辣！","遥遥领先！","稳如老狗","6到飞起","这就是天赋？","绷住了！","干净又卫生","手速逆天","有点东西"];
const GOOD=["还行吧","勉强及格","就这？","差点意思","小赚一口","马马虎虎"];
const MISS=["蚌埠住了","小丑竟是你自己","急了急了","手是脚踩的吧","退！退！退！","破防了","指纹不服","离谱到家"];
const TIMEOUT=["人都麻了？","你在等什么？","圈都落地了！","发什么呆呢"];
const LEVELS=["绷门新手","初级绷徒","绷场常客","绷界新星","绷力惊人","绷中之王","绷神下凡","抽象宗师","手指成精","绷学奇才"];
const INTROS={
  trickster:"新圈型：它会突然减速，别上当",
  golden:"新圈型：金圈分数翻倍，窗口更窄",
  bouncer:"新圈型：缩过头会弹回来一次",
  reverse:"新圈型：这个圈从小长大，等它撞上白圈"
};
const ACH=[
  {id:"first", name:"绷界入门", desc:"完成第一次判定"},
  {id:"c10",   name:"十连绷神", desc:"单局 10 连绷"},
  {id:"c20",   name:"二十连绷", desc:"单局 20 连绷"},
  {id:"s30",   name:"小有名气", desc:"单局 30 分"},
  {id:"s60",   name:"绷界传奇", desc:"单局 60 分"},
  {id:"p10",   name:"精准打击", desc:"单局 10 次 Perfect"},
  {id:"gold",  name:"金手",     desc:"命中一次金圈 Perfect"},
  {id:"back",  name:"回头是岸", desc:"在弹回圈第二段命中"},
  {id:"night", name:"夜猫子绷手", desc:"凌晨 0-5 点开绷"},
  {id:"p100",  name:"百分俱乐部", desc:"累计 100 次 Perfect"},
  {id:"d3",    name:"一日三绷", desc:"一天玩 3 局"},
  {id:"g5",    name:"金卷王",   desc:"单局 5 次金圈 Perfect"},
  {id:"h12",   name:"丝滑天胡", desc:"单局 12 连 Perfect"},
  {id:"s100",  name:"绷学奇才", desc:"单局 100 分"},
  {id:"daily1",name:"每日打卡", desc:"完成一局每日挑战"},
  {id:"boss1", name:"绷王认证", desc:"绷王时刻 3 连全中"}
];
const CAREER_TITLES=[[0,"摸鱼选手"],[50,"绷门学徒"],[150,"绷场常客"],[300,"绷界新星"],[600,"绷力惊人"],[1000,"绷中之王"],[1600,"绷神下凡"],[2500,"抽象宗师"],[4000,"手指成精"],[6000,"绷学奇才"]];

function roast(s){
  if(s<=4)  return "这手是租的吧？建议退货";
  if(s<=9)  return "小丑竟是你自己 🤡";
  if(s<=19) return "有点东西，但不多";
  if(s<=29) return "手速可以，脑子很抽象";
  if(s<=49) return "恭喜，你已是抽象区凡人";
  if(s<=79) return "你不是普通人，你是抽象人";
  return "手指已成精，建议申报非遗";
}
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function careerTitle(p){ let t=CAREER_TITLES[0][1]; for(const [th,n] of CAREER_TITLES) if(p>=th) t=n; return t; }
function todayKey(){ return dkey(); }

/* ---------- 每日挑战：固定种子，全网同关 ---------- */
function dkey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function hashSeed(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

/* ---------- 画布 ---------- */
function resize(){
  const r=cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2.5);
  W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  minD=Math.min(W,H); cx=W/2; cy=H/2;
  stars=[];
  for(let i=0;i<42;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:0.2+Math.random()*0.8,s:0.5+Math.random()*1.8});
  vig=document.createElement("canvas");
  vig.width=cv.width; vig.height=cv.height;
  const v=vig.getContext("2d");
  const g=v.createRadialGradient(cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*0.42,cv.width/2,cv.height/2,Math.max(cv.width,cv.height)*0.75);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,0.5)");
  v.fillStyle=g; v.fillRect(0,0,vig.width,vig.height);
}
window.addEventListener("resize",resize); resize();

/* ---------- 音效 + 背景音乐（本地合成，无素材） ---------- */
function ensureAC(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==="suspended") AC.resume();
}
function beep(f0,f1,dur,type,vol){
  if(muted||!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol||0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
const sfx={
  perfect:()=>beep(660,990,0.09,"square",0.12),
  golden:()=>{ beep(880,1320,0.09,"square",0.12); setTimeout(()=>beep(1100,1650,0.09,"square",0.10),70); },
  boss:()=>{ beep(523,784,0.08,"square",0.12); setTimeout(()=>beep(659,988,0.08,"square",0.12),60); setTimeout(()=>beep(784,1175,0.1,"square",0.12),120); },
  good:()=>beep(440,520,0.08,"triangle",0.10),
  miss:()=>beep(200,80,0.28,"sawtooth",0.14),
  over:()=>{ beep(330,110,0.5,"sawtooth",0.12); setTimeout(()=>beep(220,60,0.6,"sawtooth",0.10),160); }
};
function vib(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

const SCALE=[220,261.63,293.66,329.63,392,440];
let musicTimer=null, nextNote=0, mStep=0;
function playNote(f,t,d,vol,type){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||"triangle"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.05);
}
function startMusic(){
  if(!MUSIC_ON||muted||!AC) return;
  stopMusic();
  nextNote=AC.currentTime+0.1; mStep=0;
  musicTimer=setInterval(()=>{
    if(muted||!AC) return;
    if(nextNote<AC.currentTime) nextNote=AC.currentTime+0.05;   // 后台节流后跳到当前
    while(nextNote<AC.currentTime+0.25){
      const inten=Math.min(1,combo/20);
      if(mStep%8===0) playNote(110,nextNote,0.3,0.05,"sine");   // 低音脉搏
      if(mStep%2===0||Math.random()<inten*0.7){
        const n=SCALE[(mStep*3+((mStep*7)%5))%SCALE.length]*(combo>=15?2:1);
        playNote(n,nextNote,0.14,0.028+inten*0.03);
      }
      mStep++; nextNote+=0.165;
    }
  },100);
}
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

/* ---------- UI：toast 走队列，避免互相顶掉 ---------- */
const toastQ=[]; let toastBusy=false;
function toast(txt,cls){ toastQ.push({txt,cls}); pumpToast(); }
function pumpToast(){
  if(toastBusy||!toastQ.length) return;
  toastBusy=true;
  const t=toastQ.shift();
  toastEl.textContent=t.txt;
  toastEl.className=t.cls;
  void toastEl.offsetWidth;
  toastEl.classList.add("show");
  setTimeout(()=>{ toastBusy=false; pumpToast(); },950);
}
function setHud(){
  hudScore.textContent=score;
  hudLevel.textContent=(daily?"每日 · ":"")+LEVELS[Math.min(Math.floor(score/10),LEVELS.length-1)];
  hudCombo.textContent=combo>=2?("🔥 "+combo+" 连绷"):"";
  hudCombo.classList.toggle("hot",combo>=10);
  livesEl.textContent="🤡".repeat(Math.max(lives,0));
  hue=(260+combo*22)%360;
  document.documentElement.style.setProperty("--hue",hue);
}
function setRingLabel(){
  if(!ring||mode!=="play"){ hudRing.textContent=""; return; }
  if(ring.type==="boss"){ hudRing.textContent="👑 绷王时刻 "+bossHits+"/3"; hudRing.style.color="#ffb86b"; }
  else if(ring.type==="golden"){ hudRing.textContent="💰 金圈 ×2分"; hudRing.style.color="#ffd666"; }
  else if(ring.type==="trickster"){ hudRing.textContent="⚠ 变速圈"; hudRing.style.color="#ff6b81"; }
  else if(ring.type==="bouncer"){ hudRing.textContent="↩ 弹回圈"; hudRing.style.color="#7cffb2"; }
  else if(ring.type==="reverse"){ hudRing.textContent="↑ 反向圈"; hudRing.style.color="#8ecbff"; }
  else hudRing.textContent="";
}
function updateMenuLines(){
  achCount.textContent="🏆 成就 "+unlocked.size+"/"+ACH.length;
  careerLine.textContent="累计绷力 "+career.points+" · "+careerTitle(career.points);
}
function unlockAch(id){
  if(unlocked.has(id)) return;
  const a=ACH.find(x=>x.id===id); if(!a) return;
  unlocked.add(id);
  try{ localStorage.setItem("biebengle_achv",JSON.stringify([...unlocked])); }catch(e){}
  toast("🏆 成就解锁："+a.name,"t-ach");
  updateMenuLines();
}
function shake(){ stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); }
function tierEmoji(){
  if(combo>=30) return "🛸"; if(combo>=20) return "👽"; if(combo>=14) return "🤯";
  if(combo>=9)  return "😎"; if(combo>=5)  return "😏"; if(combo>=2)  return "😌";
  return "🙂";
}

/* ---------- 战绩页 ---------- */
function showStats(){
  const cells=[
    ["累计绷力",career.points+" · "+careerTitle(career.points)],
    ["总局数",career.games],["最高分",Math.max(career.bestScore,best)],
    ["最高连绷",career.bestCombo],["累计 Perfect",career.perfects],["今日局数",(career.days[dkey()]||0)]
  ];
  statGrid.innerHTML=cells.map(c=>'<div class="stat-cell"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>').join("");
  achGrid.innerHTML=ACH.map(a=>{
    const has=unlocked.has(a.id);
    return '<div class="ach-cell'+(has?"":" locked")+'"><div class="n">'+(has?"🏆":"🔒")+" "+a.name+'</div><div class="d">'+a.desc+'</div></div>';
  }).join("");
  statsEl.classList.remove("hidden");
}

/* ---------- 流程 ---------- */
function startGame(isDaily){
  clearTimeout(spawnTimer);
  daily=!!isDaily;
  if(daily){ dailyKey=dkey(); rng=mulberry32(hashSeed("biebengle-"+dailyKey)); }
  else rng=Math.random;
  score=0; combo=0; bestCombo=0; lives=3; hits=0; perfectCount=0;
  emptyStreak=0; lastResolve=0;
  bossQueue=0; bossHits=0; purePerfectStreak=0; goldenPerfRun=0;
  speed=BASE; ring=null; particles=[]; ghosts=[]; skullT=0;
  mode="play";
  menuEl.classList.add("hidden"); overEl.classList.add("hidden"); statsEl.classList.add("hidden");
  setHud(); setRingLabel();
  toast(daily?"每日挑战 · 绷住！":"绷住！","t-good");
  nextRing(500);
  startMusic();
}
function poolFor(hits){
  const p=["normal"];
  if(hits>=10) p.push("trickster");
  if(hits>=20) p.push("golden");
  if(hits>=30) p.push("bouncer");
  if(hits>=40) p.push("reverse");
  return p;
}
function spawn(){
  if(mode!=="play") return;
  const jitter=1+rng()*0.06;                       // 种子随机：每日全网一致
  const pool=poolFor(hits);
  let type=pool[Math.floor(rng()*pool.length)];
  const slowAt=1.3+rng()*0.5;
  const spdJit=1+rng()*0.1;                        // 出生速度抖动，防背板
  if(bossQueue>0) type="boss";
  if(type==="reverse") ring={ f:0.045, type:type, dir:1, bounced:false, slowAt:slowAt, spdJit:spdJit };
  else ring={ f:F_START*jitter, type:type, dir:-1, bounced:false, slowAt:slowAt, spdJit:spdJit };
  if(INTROS[type]&&!seenTypes[type]){
    seenTypes[type]=1;
    try{ localStorage.setItem("biebengle_seen",JSON.stringify(seenTypes)); }catch(e){}
    toast(INTROS[type],"t-good");
  }
  setRingLabel();
}
function nextRing(delay){ clearTimeout(spawnTimer); spawnTimer=setTimeout(spawn,delay); }
function burst(h,n){
  const count=n||16;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, sp=rand(90,300)*(minD/420);
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:rand(.4,.8),t:0,size:rand(3,7),hue:h});
  }
}
function ringColor(){
  if(ring&&ring.type==="boss")     return "hsl(18 100% 60%)";
  if(ring&&ring.type==="golden")   return "hsl(46 100% 60%)";
  if(ring&&ring.type==="trickster")return "hsl(350 95% 65%)";
  if(ring&&ring.type==="bouncer")  return "hsl(140 80% 60%)";
  if(ring&&ring.type==="reverse")  return "hsl(205 95% 66%)";
  return "hsl("+hue+" 95% 62%)";
}
function finishRing(delay){
  ring=null;
  lastResolve=performance.now(); emptyStreak=0;
  setRingLabel(); setHud();
  nextRing(delay);
}
function onEmptyPress(){
  if(performance.now()-lastResolve<250) return;    // 刚结算完的误触不记
  emptyStreak++;
  if(emptyStreak>=3){ emptyStreak=0; loseLife("手痒是病，得治"); }
  else if(emptyStreak===1) toast("别乱按！","t-good");
  else toast("真急了？","t-good");
}
function press(){
  if(mode!=="play") return;
  if(!ring){ onEmptyPress(); return; }
  const T=T_FRAC*minD, r=ring.f*minD, d=Math.abs(r-T);
  const boss=ring.type==="boss", gold=ring.type==="golden";
  const pw=boss?T*0.10:(gold?T*0.09:T*0.16);
  const gw=boss?T*0.24:(gold?T*0.22:T*0.40);
  const slowZone=ring.type==="trickster"&&r<=ring.slowAt*T;
  unlockAch("first");
  if(d<=pw){                                       // perfect
    const prev=score;
    const inc=boss?6:(gold?4:2);
    score+=inc; combo++; hits++; perfectCount++;
    purePerfectStreak++; bestCombo=Math.max(bestCombo,combo);
    if(gold){ goldenPerfRun++; unlockAch("gold"); if(goldenPerfRun>=5) unlockAch("g5"); }
    if(purePerfectStreak>=12) unlockAch("h12");
    if(boss){
      bossHits++; bossQueue--;
      (sfx.boss)(); vib(25); flash=0.36; burst(30,22);
      if(bossHits>=3){ unlockAch("boss1"); toast("👑 绷王认证！","t-ach"); bossQueue=0; }
      else toast("👑 绷王 "+bossHits+"/3","t-ach");
    }else{
      toast(slowZone?"看穿你了！":pick(PERFECT),"t-perfect");
      (gold?sfx.golden:sfx.perfect)(); vib(18); flash=0.32;
      burst(gold?46:hue);
    }
    ghosts.push({r:r,life:1,color:ringColor()});
    if(ring.type==="bouncer"&&ring.bounced) unlockAch("back");
    finishRing(340);
    if(Math.floor(score/50)>Math.floor(prev/50)&&bossQueue===0){
      bossQueue=3; bossHits=0;
      toast("👑 绷王时刻！","t-ach");
    }
  }else if(d<=gw){                                 // good
    score+=1; hits++; combo=0; purePerfectStreak=0;
    toast(pick(GOOD),"t-good"); sfx.good(); vib(10);
    ghosts.push({r:r,life:1,color:"rgba(255,255,255,.7)"});
    finishRing(340);
  }else{                                           // 按歪
    loseLife(d<=gw*1.35?"就差一点！":pick(MISS));
    return;
  }
  if(combo>=10) unlockAch("c10");
  if(combo>=20) unlockAch("c20");
  if(score>=30) unlockAch("s30");
  if(score>=60) unlockAch("s60");
  if(score>=100) unlockAch("s100");
  if(perfectCount>=10) unlockAch("p10");
}
function loseLife(msg){
  combo=0; lives--; skullT=0.7; purePerfectStreak=0;
  lastResolve=performance.now(); emptyStreak=0;
  shake(); sfx.miss(); vib([30,40,30]);
  toast(msg,"t-miss");
  ring=null; bossQueue=0; clearTimeout(spawnTimer);
  setRingLabel(); setHud();
  if(lives<=0){ gameOver(); return; }
  nextRing(650);
}
function saveCareer(){
  try{ localStorage.setItem("biebengle_stats",JSON.stringify(career)); }catch(e){}
}
function gameOver(){
  mode="over"; ring=null; clearTimeout(spawnTimer); stopMusic();
  sfx.over(); vib([40,60,40]);
  const hour=new Date().getHours();
  if(hour>=0&&hour<5) unlockAch("night");
  if(daily) unlockAch("daily1");
  career.points+=score; career.games++; career.perfects+=perfectCount;
  if(score>career.bestScore) career.bestScore=score;
  if(bestCombo>career.bestCombo) career.bestCombo=bestCombo;
  const tk=todayKey(); career.days[tk]=(career.days[tk]||0)+1;
  if(career.days[tk]>=3) unlockAch("d3");
  if(career.perfects>=100) unlockAch("p100");
  if(score>best){ best=score; try{ localStorage.setItem("biebengle_best",best); }catch(e){} }
  saveCareer();
  finalScore.textContent=score;
  finalCombo.textContent=bestCombo;
  finalBest.textContent=best;
  finalCareer.textContent=career.points+" · "+careerTitle(career.points);
  careerRow.style.display="";
  roastEl.textContent=(daily?"【每日挑战】":"")+roast(score);
  if(daily){
    let db=0; const k="biebengle_daily_"+dailyKey;
    try{ db=+(localStorage.getItem(k)||0); if(score>db){ db=score; localStorage.setItem(k,db); } }catch(e){ db=score; }
    finalDaily.textContent=db;
    dailyRow.style.display="";
  }else dailyRow.style.display="none";
  overEl.classList.remove("hidden");
  updateMenuLines();
}
async function shareScore(){
  const tag=daily?("每日挑战("+dailyKey+")"):"";
  const txt="我在《别绷了》"+tag+"拿了 "+score+" 分，最高 "+bestCombo+" 连绷！"+roast(score)+" 不服来战 👉";
  if(navigator.share){
    try{ await navigator.share({title:"别绷了",text:txt}); return; }
    catch(e){ if(e&&e.name==="AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(txt); toast("已复制，快去挑衅","t-good"); }
  catch(e){ toast("复制失败，截图发吧","t-miss"); }
}

/* ---------- 主循环 ---------- */
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(mode==="play"&&ring){
    const T=T_FRAC*minD;
    let sp=speed*ring.spdJit;
    if(ring.type==="golden") sp*=1.15;
    if(ring.type==="boss") sp*=1.2;
    if(ring.type==="trickster"&&ring.f*minD<=ring.slowAt*T) sp*=0.32;
    ring.f+=ring.dir*sp*dt*(ring.dir>0&&ring.type!=="reverse"?1.6:1);
    const r=ring.f*minD;
    if(ring.dir<0){
      if(ring.type==="bouncer"&&!ring.bounced&&r<=T*0.45){
        ring.bounced=true; ring.dir=1;
        toast("↩ 弹回来了！","t-good");
      }else if(r<=T*0.05){ loseLife(pick(TIMEOUT)); }
    }else{
      if(ring.type==="reverse"&&r>=F_START*1.12){ loseLife("圈都飞走了！"); }
      else if(ring.type!=="reverse"&&r>=F_START*0.72){ ring.dir=-1; }
    }
  }
  for(const st of stars){ st.y-=st.z*14*dt; if(st.y<-4){ st.y=H+4; st.x=Math.random()*W; } }
  for(const p of particles){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.98; p.vy*=0.98; }
  particles=particles.filter(p=>p.t<p.life);
  for(const g of ghosts){ g.life-=dt*3.2; }
  ghosts=ghosts.filter(g=>g.life>0);
  flash=Math.max(0,flash-dt*1.6);
  skullT=Math.max(0,skullT-dt);
  draw(now);
  requestAnimationFrame(loop);
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  const T=T_FRAC*minD;
  ctx.fillStyle="rgba(255,255,255,.35)";           // 星空
  for(const st of stars){
    ctx.globalAlpha=0.12+st.z*0.2;
    ctx.beginPath(); ctx.arc(st.x,st.y,st.s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(mode!=="play"){                                // 非对局：氛围旋转环
    ctx.globalAlpha=0.15;
    ctx.strokeStyle="#8f6cff"; ctx.lineWidth=Math.max(4,minD*0.016); ctx.lineCap="round";
    const sp0=now/2400;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(cx,cy,F_START*minD*0.92,sp0+i*Math.PI/2,sp0+i*Math.PI/2+Math.PI/2.6);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  ctx.save();                                       // 目标白圈
  ctx.shadowColor="rgba(255,255,255,.7)"; ctx.shadowBlur=18;
  ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,T,0,7); ctx.stroke();
  ctx.restore();
  for(const g of ghosts){                           // 命中扩散圈
    ctx.strokeStyle=g.color; ctx.globalAlpha=g.life*0.8; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(cx,cy,g.r+(1-g.life)*T*1.1,0,7); ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(mode==="play"&&ring){                          // 彩圈（四段弧，旋转 + 拖尾）
    const r=ring.f*minD, col=ringColor();
    const spin=(ring.type==="reverse"?-1:1)*now/600;
    const trail=r-ring.dir*speed*ring.spdJit*minD*0.05;
    ctx.lineCap="round";
    if(trail>2){
      ctx.save();
      ctx.globalAlpha=0.22; ctx.strokeStyle=col; ctx.lineWidth=Math.max(4,minD*0.018);
      for(let i=0;i<4;i++){
        ctx.beginPath();
        ctx.arc(cx,cy,trail,spin+i*Math.PI/2,spin+i*Math.PI/2+Math.PI/2.6);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=24;
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(5,minD*0.022);
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(cx,cy,r,spin+i*Math.PI/2,spin+i*Math.PI/2+Math.PI/2.6);
      ctx.stroke();
    }
    ctx.restore();
  }
  for(const p of particles){
    ctx.globalAlpha=1-p.t/p.life;
    ctx.fillStyle="hsl("+p.hue+" 90% 65%)";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  const e=skullT>0?"💀":tierEmoji();                // 中心表情
  ctx.font=Math.round(T*1.15)+"px serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(e,cx,cy+T*0.06);
  if(vig) ctx.drawImage(vig,0,0,W,H);               // 暗角
  if(flash>0){ ctx.fillStyle="rgba(255,255,255,"+flash+")"; ctx.fillRect(0,0,W,H); }
}
requestAnimationFrame(loop);

/* ---------- 输入 ---------- */
stage.addEventListener("pointerdown",e=>{
  ensureAC();
  if(e.target.closest("button")) return;
  if(mode==="play") press();
});
$("btn-start").addEventListener("click",()=>{ ensureAC(); startGame(false); });
$("btn-daily").addEventListener("click",()=>{ ensureAC(); startGame(true); });
$("btn-stats").addEventListener("click",showStats);
$("btn-stats-back").addEventListener("click",()=>statsEl.classList.add("hidden"));
$("btn-again").addEventListener("click",()=>{ ensureAC(); startGame(daily); });
$("btn-home").addEventListener("click",()=>{
  mode="menu"; overEl.classList.add("hidden"); menuEl.classList.remove("hidden"); updateMenuLines();
});
$("btn-copy").addEventListener("click",shareScore);
muteBtn.addEventListener("click",()=>{ muted=!muted; muteBtn.textContent=muted?"🔇":"🔊"; });
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){
    e.preventDefault(); ensureAC();
    if(mode==="play") press();
    else startGame(daily&&mode==="over");
  }
});
cv.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("visibilitychange",()=>{ last=performance.now(); });
updateMenuLines();

/* ---------- PWA：仅在 http(s) 下尝试注册，file:// 打开不受影响；测试钩子模式下跳过 ---------- */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!/^#auto/.test(location.hash)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- 自测钩子 ---------- */
const hsh=location.hash;
if(hsh==="#autotest"||hsh==="#autolose"||hsh==="#autodaily"){
  setTimeout(()=>{
    startGame(hsh==="#autodaily");
    if(hsh==="#autolose") setInterval(()=>{ if(mode==="play"&&ring){ ring.f=T_FRAC*2.5; press(); } },1300);
    else setInterval(()=>{ if(mode==="play"&&ring){ ring.f=T_FRAC; press(); } },300);
  },500);
}
if(hsh==="#autostats"){ setTimeout(showStats,800); }
})();
