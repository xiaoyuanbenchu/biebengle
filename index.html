<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<meta property="og:image" content="https://xiaoyuanbenchu.github.io/biebengle/icon-512.png" />
<title>别绷了 · 一个很抽象的反应力测试</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b12; }
  #cv { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* 网页端引导：把 URL 参数（复仇链）和测试钩子注入全局，供 js/core.js 读取 */
(function () {
  "use strict";
  const q = {};
  try {
    new URLSearchParams(location.search).forEach((v, k) => { q[k] = v; });
    const hash = location.hash.replace(/^#/, "").split("&");
    if (hash[0] && hash[0].indexOf("=") === -1) window.__TEST__ = hash[0];
    for (let i = (window.__TEST__ ? 1 : 0); i < hash.length; i++) {
      const kv = hash[i].split("=");
      if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || "");
    }
  } catch (e) {}
  window.__QUERY__ = q;
  /* 公测诊断：收集页面级报错，随玩家反馈一起打包 */
  window.__ERRS__ = [];
  window.addEventListener("error", e => {
    window.__ERRS__.push(((e && e.message) || "error").slice(0, 60));
    if (window.__ERRS__.length > 5) window.__ERRS__.shift();
  });
})();
</script>
<script src="js/core.js"></script>
</body>
</html>
